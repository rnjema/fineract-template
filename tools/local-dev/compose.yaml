name: capstone-fineract-local

services:
  db:
    image: mariadb:10.8
    environment:
      MARIADB_ROOT_PASSWORD: ${LOCAL_DB_PASSWORD:?Run Initialize-Local.ps1 first}
      MARIADB_ROOT_HOST: "%"
      TZ: UTC
    volumes:
      - capstone_db:/var/lib/mysql
      - type: bind
        source: ./init-db.sql
        target: /docker-entrypoint-initdb.d/01-databases.sql
        read_only: true
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MARIADB_ROOT_PASSWORD}" mariadb-admin ping -h 127.0.0.1 -uroot --silent']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 768m

  fineract:
    image: eclipse-temurin:17-jre
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - type: bind
        source: ${FINERACT_JAR:?Run Initialize-Local.ps1 first}
        target: /app/fineract-provider.jar
        read_only: true
    entrypoint: [java, -jar, /app/fineract-provider.jar]
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx1024m -XX:ActiveProcessorCount=2 -Duser.timezone=UTC
      TZ: UTC
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.mariadb.jdbc.Driver
      FINERACT_HIKARI_JDBC_URL: "jdbc:mariadb://db:3306/fineract_tenants?useSSL=false"
      FINERACT_HIKARI_USERNAME: root
      FINERACT_HIKARI_PASSWORD: ${LOCAL_DB_PASSWORD}
      FINERACT_HIKARI_MINIMUM_IDLE: "1"
      FINERACT_HIKARI_MAXIMUM_POOL_SIZE: "5"
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: db
      FINERACT_DEFAULT_TENANTDB_PORT: "3306"
      FINERACT_DEFAULT_TENANTDB_UID: root
      FINERACT_DEFAULT_TENANTDB_PWD: ${LOCAL_DB_PASSWORD}
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_DESCRIPTION: Capstone synthetic local tenant
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: UTC
      FINERACT_DEFAULT_TENANTDB_CONN_PARAMS: ""
      FINERACT_SERVER_PORT: "8443"
      FINERACT_SERVER_SSL_ENABLED: "true"
      FINERACT_SERVER_SERVLET_CONTEXT_PATH: /fineract-provider
      FINERACT_SERVER_TOMCAT_THREADS_MAX: "50"
      FINERACT_SECURITY_BASICAUTH_ENABLED: "true"
      FINERACT_SECURITY_OAUTH_ENABLED: "false"
      FINERACT_SECURITY_2FA_ENABLED: "false"
      AFRICASTALKING_ENABLED: "false"
      JOURNAL_ENTRY_OUTCOME_CONSUMER_ENABLED: "false"
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  capstone_db:
